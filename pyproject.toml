[project]
name = "b3-stocks-dashboard"
version = "1.1.0"
description = "Interactive Streamlit dashboard for analyzing Brazilian stock market data from B3."
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Renato" },
]
keywords = ["b3", "stocks", "dashboard", "streamlit", "yfinance", "ibovespa"]

dependencies = [
    "streamlit>=1.54.0",
    "pandas>=2.3.3",
    "numpy>=2.4.2",
    "yfinance>=1.0",
    "matplotlib>=3.10.8",
    "seaborn>=0.13.2",
    "requests>=2.32.5",
    "curl-cffi>=0.13.0",
    "tenacity>=9.1.2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "UP",
    "B",
    "SIM",
    "RUF",
]
ignore = [
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"app/ui/**/*.py" = ["E402"]

[tool.ruff.format]
quote-style = 'single'
indent-style = "space"

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
disallow_untyped_defs = false
no_implicit_optional = true
exclude = ["docs/", ".venv/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
