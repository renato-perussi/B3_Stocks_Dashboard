[project]
name = "b3-stocks-dashboard"
version = "1.1.0"
description = "Interactive Streamlit dashboard for analyzing Brazilian stock market data from B3."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Renato" },
]
keywords = ["b3", "stocks", "dashboard", "streamlit", "yfinance", "ibovespa"]

dependencies = [
    "streamlit>=1.54.0",
    "pandas>=2.3.0",
    "numpy>=2.0.0",
    "yfinance>=1.0",
    "matplotlib>=3.10.0",
    "seaborn>=0.13.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["app"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # Ruff-specific rules
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"app/ui/**/*.py" = ["E402"]  # Streamlit often needs imports after page config

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
disallow_untyped_defs = false
no_implicit_optional = true
exclude = ["image/", ".venv/"]
